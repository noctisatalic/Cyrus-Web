<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body,#v{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:white;
}
#v{touch-action:none}
canvas{display:block}
</style>
</head>
<body>

<div id="v"></div>

<script src="./three.min.js"></script>
<script>
const v=document.getElementById("v");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xffffff);

const camera=new THREE.PerspectiveCamera(
  45,
  innerWidth/innerHeight,
  .1,
  100
);

camera.position.set(0,0,5);

const renderer=new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
v.appendChild(renderer.domElement);

scene.add(
  new THREE.AmbientLight(0xffffff,2)
);

const light=new THREE.DirectionalLight(
  0xffffff,
  4
);

light.position.set(3,4,5);
scene.add(light);

const group=new THREE.Group();
scene.add(group);

const material=new THREE.MeshStandardMaterial({
  color:0x111111,
  roughness:.25,
  metalness:.5
});

const band=new THREE.Mesh(
  new THREE.TorusGeometry(1.25,.12,24,64,Math.PI),
  material
);

band.rotation.z=Math.PI;
band.position.y=.35;
group.add(band);

const left=new THREE.Mesh(
  new THREE.CylinderGeometry(.55,.55,.35,64),
  material
);

left.rotation.x=Math.PI/2;
left.position.x=-1.25;
group.add(left);

const right=left.clone();
right.position.x=1.25;
group.add(right);

let down=false;
let last=0;

renderer.domElement.addEventListener(
  "pointerdown",
  e=>{
    down=true;
    last=e.clientX;
    renderer.domElement.setPointerCapture(e.pointerId);
  }
);

renderer.domElement.addEventListener(
  "pointermove",
  e=>{
    if(!down)return;
    group.rotation.y+=(e.clientX-last)*.01;
    last=e.clientX;
  }
);

renderer.domElement.addEventListener(
  "pointerup",
  ()=>{
    down=false;
  }
);

function resize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}

addEventListener("resize",resize);

function animate(){
  requestAnimationFrame(animate);
  group.rotation.y+=.003;
  renderer.render(scene,camera);
}

animate();
</script>
</body>
</html>
