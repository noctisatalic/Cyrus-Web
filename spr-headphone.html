<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>Cyrus — Studio Headphone Viewer</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#f4f4f2;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#viewer{
  position:relative;
  width:100%;
  height:100%;
  touch-action:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

.ui{
  position:absolute;
  left:22px;
  right:22px;
  bottom:22px;
  display:flex;
  justify-content:space-between;
  align-items:end;
  pointer-events:none;
}

.label{
  color:#111;
}

.label small{
  display:block;
  margin-bottom:5px;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  opacity:.45;
}

.label strong{
  font-size:16px;
  font-weight:600;
  letter-spacing:-.02em;
}

.hint{
  padding:9px 13px;
  border:1px solid rgba(0,0,0,.08);
  border-radius:999px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(12px);
  color:#222;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
}
</style>
</head>

<body>

<div id="viewer"></div>

<div class="ui">
  <div class="label">
    <small>Cyrus Studio</small>
    <strong>Headphone Concept</strong>
  </div>

  <div class="hint">
    Drag to explore
  </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* =========================================================
   SCENE
========================================================= */

const viewer =
  document.getElementById("viewer");

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0xf4f4f2);


/* =========================================================
   CAMERA
========================================================= */

const camera =
  new THREE.PerspectiveCamera(
    35,
    innerWidth / innerHeight,
    .1,
    100
  );

function updateCameraFraming(){

  const aspect =
    innerWidth / innerHeight;

  let distance;

  if(aspect < .65){

    // Mobile portrait — slightly smaller, centered
    distance = 7.55;

  }else if(aspect < .9){

    // Tablet / narrow screen
    distance = 6.85;

  }else if(aspect < 1.4){

    // Normal desktop
    distance = 6.55;

  }else{

    // Wide desktop
    distance = 6.30;

  }

  camera.position.set(
    0,
    .08,
    distance
  );

  camera.aspect =
    aspect;

  camera.updateProjectionMatrix();
}

updateCameraFraming();


/* =========================================================
   RENDERER
========================================================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    alpha:false
  });

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
  1.15;

viewer.appendChild(
  renderer.domElement
);


/* =========================================================
   PRODUCT
========================================================= */

const product =
  new THREE.Group();

scene.add(product);


/* =========================================================
   MATERIALS
========================================================= */

const black =
  new THREE.MeshPhysicalMaterial({
    color:0x101214,
    roughness:.25,
    metalness:.38,
    clearcoat:1,
    clearcoatRoughness:.12
  });

const softBlack =
  new THREE.MeshPhysicalMaterial({
    color:0x090a0b,
    roughness:.72,
    metalness:.02
  });

const metal =
  new THREE.MeshPhysicalMaterial({
    color:0x8b8f94,
    roughness:.18,
    metalness:1,
    clearcoat:.5
  });

const inner =
  new THREE.MeshPhysicalMaterial({
    color:0x020202,
    roughness:.95,
    metalness:0
  });


/* =========================================================
   HEADBAND
========================================================= */

const bandCurve =
  new THREE.CatmullRomCurve3([

    new THREE.Vector3(-1.18, 0.00, 0),
    new THREE.Vector3(-1.19, 0.30, 0),
    new THREE.Vector3(-1.16, 0.60, 0),
    new THREE.Vector3(-1.08, 0.88, 0),
    new THREE.Vector3(-.95, 1.12, 0),
    new THREE.Vector3(-.78, 1.32, 0),
    new THREE.Vector3(-.58, 1.46, 0),
    new THREE.Vector3(-.35, 1.54, 0),
    new THREE.Vector3(-.12, 1.58, 0),
    new THREE.Vector3(0, 1.59, 0),
    new THREE.Vector3(.12, 1.58, 0),
    new THREE.Vector3(.35, 1.54, 0),
    new THREE.Vector3(.58, 1.46, 0),
    new THREE.Vector3(.78, 1.32, 0),
    new THREE.Vector3(.95, 1.12, 0),
    new THREE.Vector3(1.08, 0.88, 0),
    new THREE.Vector3(1.16, 0.60, 0),
    new THREE.Vector3(1.19, 0.30, 0),
    new THREE.Vector3(1.18, 0.00, 0)

  ]);

const band =
  new THREE.Mesh(
    new THREE.TubeGeometry(
      bandCurve,
      120,
      .105,
      24,
      false
    ),
    black
  );

product.add(band);


/* =========================================================
   INNER BAND
========================================================= */

const innerBandCurve =
  new THREE.CatmullRomCurve3([

    new THREE.Vector3(-1.05, 0.05, 0.015),
    new THREE.Vector3(-1.06, 0.32, 0.015),
    new THREE.Vector3(-1.03, 0.58, 0.015),
    new THREE.Vector3(-.96, 0.82, 0.015),
    new THREE.Vector3(-.84, 1.04, 0.015),
    new THREE.Vector3(-.68, 1.21, 0.015),
    new THREE.Vector3(-.49, 1.34, 0.015),
    new THREE.Vector3(-.28, 1.41, 0.015),
    new THREE.Vector3(0, 1.44, 0.015),
    new THREE.Vector3(.28, 1.41, 0.015),
    new THREE.Vector3(.49, 1.34, 0.015),
    new THREE.Vector3(.68, 1.21, 0.015),
    new THREE.Vector3(.84, 1.04, 0.015),
    new THREE.Vector3(.96, 0.82, 0.015),
    new THREE.Vector3(1.03, 0.58, 0.015),
    new THREE.Vector3(1.06, 0.32, 0.015),
    new THREE.Vector3(1.05, 0.05, 0.015)

  ]);

const innerBand =
  new THREE.Mesh(
    new THREE.TubeGeometry(
      innerBandCurve,
      80,
      .055,
      16,
      false
    ),
    softBlack
  );

product.add(innerBand);


/* =========================================================
   EAR CUPS
========================================================= */

function createCup(side){

  const cup =
    new THREE.Group();

  // Symmetry lock — kedua ear cup memakai basis transform identik
  cup.scale.set(1, 1, 1);
  cup.rotation.set(0, 0, 0);

  cup.position.x =
    side * 1.18;

  // True left/right symmetry
  cup.scale.set(
    side < 0 ? -1 : 1,
    1,
    1
  );


  /* BODY */

  const body =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .48,
        .52,
        .34,
        64
      ),
      black
    );

  body.rotation.z =
    Math.PI / 2;

  cup.add(body);


  /* FRONT PLATE */

  const plate =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .43,
        .43,
        .045,
        64
      ),
      black
    );

  plate.rotation.z =
    Math.PI / 2;

  plate.position.x =
    -side * .19;

  cup.add(plate);


  /* OUTER RING */

  const ring =
    new THREE.Mesh(
      new THREE.TorusGeometry(
        .43,
        .035,
        20,
        64
      ),
      metal
    );

  ring.rotation.y =
    Math.PI / 2;

  ring.position.x =
    -side * .22;

  cup.add(ring);


  /* EAR CUSHION */

  const cushion =
    new THREE.Mesh(
      new THREE.TorusGeometry(
        .35,
        .105,
        24,
        64
      ),
      softBlack
    );

  cushion.rotation.y =
    Math.PI / 2;

  cushion.position.x =
    -side * .245;

  cushion.scale.set(
    1,
    1.05,
    1.08
  );

  cup.add(cushion);


  /* INNER CAVITY */

  const cavity =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .245,
        .245,
        .025,
        64
      ),
      inner
    );

  cavity.rotation.z =
    Math.PI / 2;

  cavity.position.x =
    -side * .255;

  cup.add(cavity);


  /* DRIVER */

  const driver =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .105,
        .105,
        .018,
        48
      ),
      metal
    );

  driver.rotation.z =
    Math.PI / 2;

  driver.position.x =
    -side * .27;

  cup.add(driver);


  /* SMALL CENTER */

  const center =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .045,
        .045,
        .02,
        32
      ),
      black
    );

  center.rotation.z =
    Math.PI / 2;

  center.position.x =
    -side * .285;

  cup.add(center);


  product.add(cup);
}

createCup(-1);
createCup(1);


/* =========================================================
   LIGHTING
========================================================= */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0xb9b9b9,
    2.1
  )
);

const key =
  new THREE.DirectionalLight(
    0xffffff,
    3.2
  );

key.position.set(
  -3,
  4,
  5
);

scene.add(key);

const rim =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

rim.position.set(
  4,
  2,
  -4
);

scene.add(rim);


/* =========================================================
   FLOOR / SHADOW
========================================================= */

const floor =
  new THREE.Mesh(
    new THREE.CircleGeometry(
      2.4,
      64
    ),
    new THREE.ShadowMaterial({
      opacity:.12
    })
  );

floor.rotation.x =
  -Math.PI / 2;

floor.position.y =
  -1.02;

scene.add(floor);


/* =========================================================
   PRODUCT POSITION
========================================================= */

product.scale.set(
  .92,
  .92,
  .92
);

product.position.y =
  -.42;

product.rotation.y =
  -.28;


/* =========================================================
   INTERACTION
========================================================= */

let dragging =
  false;

let lastX =
  0;

let lastY =
  0;

let velocity =
  0;

renderer.domElement.addEventListener(
  "pointerdown",
  e => {

    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;

    renderer.domElement.setPointerCapture(
      e.pointerId
    );

  }
);

renderer.domElement.addEventListener(
  "pointermove",
  e => {

    if(!dragging)
      return;

    const dx =
      e.clientX - lastX;

    const dy =
      e.clientY - lastY;

    lastX =
      e.clientX;

    lastY =
      e.clientY;

    product.rotation.y +=
      dx * .008;

    product.rotation.x +=
      dy * .003;

    product.rotation.x =
      THREE.MathUtils.clamp(
        product.rotation.x,
        -.35,
        .35
      );

    velocity =
      dx * .0005;

  }
);

renderer.domElement.addEventListener(
  "pointerup",
  e => {

    dragging = false;

    renderer.domElement.releasePointerCapture(
      e.pointerId
    );

  }
);


/* =========================================================
   ANIMATION
========================================================= */

const clock =
  new THREE.Clock();

function animate(){

  requestAnimationFrame(
    animate
  );

  const t =
    clock.getElapsedTime();

  if(!dragging){

    product.rotation.y +=
      .0012 + velocity;

    velocity *= .94;

  }

  product.position.y =
    -.42 +
    Math.sin(t * .8) * .018;

  renderer.render(
    scene,
    camera
  );
}

animate();


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  () => {

    updateCameraFraming();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

</script>

</body>
</html>
