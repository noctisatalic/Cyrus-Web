<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}

#viewer{
  position:fixed;
  inset:0;
  overflow:hidden;
  touch-action:none;
  cursor:grab;
}

#viewer:active{
  cursor:grabbing;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}
</style>
</head>

<body>

<div id="viewer"></div>

<script src="./three.min.js"></script>

<script>
(function(){

"use strict";

/* =========================================================
   VIEWER
========================================================= */

const viewer =
  document.getElementById("viewer");

if(typeof THREE === "undefined"){
  throw new Error("THREE.JS tidak tersedia");
}

/* =========================================================
   SCENE
========================================================= */

const scene =
  new THREE.Scene();

const camera =
  new THREE.PerspectiveCamera(
    30,
    1,
    .1,
    100
  );

camera.position.set(
  0,
  .05,
  6.8
);

camera.lookAt(
  0,
  .25,
  0
);

/* =========================================================
   RENDERER
========================================================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    alpha:true,
    powerPreference:"high-performance"
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    2
  )
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
  1.12;

viewer.appendChild(
  renderer.domElement
);

/* =========================================================
   STUDIO LIGHTING
========================================================= */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x151515,
    1.8
  )
);

const key =
  new THREE.DirectionalLight(
    0xffffff,
    4.5
  );

key.position.set(
  4,
  5,
  6
);

scene.add(key);

const fill =
  new THREE.DirectionalLight(
    0xffffff,
    2.4
  );

fill.position.set(
  -5,
  2,
  4
);

scene.add(fill);

const rimLight =
  new THREE.DirectionalLight(
    0xffffff,
    3.2
  );

rimLight.position.set(
  -4,
  4,
  -6
);

scene.add(rimLight);

/* =========================================================
   MATERIALS
========================================================= */

const shellMaterial =
  new THREE.MeshPhysicalMaterial({
    color:0x111315,
    roughness:.22,
    metalness:.58,
    clearcoat:1,
    clearcoatRoughness:.12
  });

const shellSoftMaterial =
  new THREE.MeshPhysicalMaterial({
    color:0x191b1d,
    roughness:.32,
    metalness:.42,
    clearcoat:.85,
    clearcoatRoughness:.16
  });

const rubberMaterial =
  new THREE.MeshPhysicalMaterial({
    color:0x030303,
    roughness:.82,
    metalness:.01
  });

const cushionMaterial =
  new THREE.MeshPhysicalMaterial({
    color:0x080808,
    roughness:.92,
    metalness:.01
  });

const innerMaterial =
  new THREE.MeshPhysicalMaterial({
    color:0x010101,
    roughness:.98,
    metalness:0
  });

const metalMaterial =
  new THREE.MeshPhysicalMaterial({
    color:0x777b80,
    roughness:.2,
    metalness:1,
    clearcoat:.5,
    clearcoatRoughness:.12
  });

const accentMaterial =
  new THREE.MeshPhysicalMaterial({
    color:0x2c3035,
    roughness:.24,
    metalness:.8,
    clearcoat:.8
  });

/* =========================================================
   PRODUCT ROOT
========================================================= */

const product =
  new THREE.Group();

scene.add(product);

product.scale.set(
  .78,
  .78,
  .78
);

product.position.y =
  -.12;

product.rotation.y =
  -.30;

/* =========================================================
   SMOOTH HEADBAND
========================================================= */

const bandCurve =
  new THREE.CatmullRomCurve3([

    new THREE.Vector3(-1.28,-.08,0),
    new THREE.Vector3(-1.27,.48,0),
    new THREE.Vector3(-1.12,.96,0),
    new THREE.Vector3(-.82,1.34,0),
    new THREE.Vector3(-.42,1.55,0),
    new THREE.Vector3(0,1.61,0),
    new THREE.Vector3(.42,1.55,0),
    new THREE.Vector3(.82,1.34,0),
    new THREE.Vector3(1.12,.96,0),
    new THREE.Vector3(1.27,.48,0),
    new THREE.Vector3(1.28,-.08,0)

  ]);

const band =
  new THREE.Mesh(
    new THREE.TubeGeometry(
      bandCurve,
      100,
      .14,
      24,
      false
    ),
    shellMaterial
  );

product.add(band);

/* =========================================================
   INNER HEAD CUSHION
========================================================= */

const cushionCurve =
  new THREE.CatmullRomCurve3([

    new THREE.Vector3(
      -.91,
      .02,
      -.02
    ),

    new THREE.Vector3(
      -.89,
      .58,
      -.02
    ),

    new THREE.Vector3(
      -.70,
      1.02,
      -.02
    ),

    new THREE.Vector3(
      -.38,
      1.30,
      -.02
    ),

    new THREE.Vector3(
      0,
      1.39,
      -.02
    ),

    new THREE.Vector3(
      .38,
      1.30,
      -.02
    ),

    new THREE.Vector3(
      .70,
      1.02,
      -.02
    ),

    new THREE.Vector3(
      .89,
      .58,
      -.02
    ),

    new THREE.Vector3(
      .91,
      .02,
      -.02
    )

  ]);

const headCushion =
  new THREE.Mesh(
    new THREE.TubeGeometry(
      cushionCurve,
      80,
      .075,
      20,
      false
    ),
    cushionMaterial
  );

product.add(
  headCushion
);

/* =========================================================
   EAR CUP
========================================================= */

function createCup(side){

  const cup =
    new THREE.Group();

  cup.position.set(
    side * 1.30,
    0,
    0
  );

  /*
   * Setiap ear cup mempunyai local front.
   *
   * LEFT  -> menghadap ke +X
   * RIGHT -> menghadap ke -X
   *
   * Jadi kedua speaker saling menghadap
   * ke arah kepala, bukan ke kamera.
   */

  const front =
    side < 0 ? 1 : -1;

  /* =======================================================
     MAIN HOUSING
  ======================================================= */

  const housing =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .60,
        .56,
        .38,
        96,
        1
      ),
      shellMaterial
    );

  housing.rotation.z =
    side < 0 ? Math.PI / 2 : -Math.PI / 2;

  cup.add(housing);

  /* =======================================================
     BACK SHELL
  ======================================================= */

  const backShell =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .49,
        .52,
        .10,
        96
      ),
      shellSoftMaterial
    );

  backShell.rotation.z =
    side < 0 ? Math.PI / 2 : -Math.PI / 2;

  backShell.position.x =
    -front * .20;

  cup.add(backShell);

  /* =======================================================
     FRONT FACE
  ======================================================= */

  const face =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .52,
        .52,
        .045,
        96
      ),
      shellSoftMaterial
    );

  face.rotation.z =
    side < 0 ? Math.PI / 2 : -Math.PI / 2;

  face.position.x =
    front * .205;

  cup.add(face);

  /* =======================================================
     OUTER METAL RIM
  ======================================================= */

  const outerRim =
    new THREE.Mesh(
      new THREE.TorusGeometry(
        .49,
        .052,
        24,
        96
      ),
      metalMaterial
    );

  outerRim.rotation.z =
    side < 0 ? Math.PI / 2 : -Math.PI / 2;

  outerRim.position.x =
    front * .235;

  cup.add(outerRim);

  /* =======================================================
     EAR CUSHION
  ======================================================= */

  const earCushion =
    new THREE.Mesh(
      new THREE.TorusGeometry(
        .385,
        .115,
        32,
        96
      ),
      cushionMaterial
    );

  /*
   * Torus default menghadap sepanjang Z.
   * Diputar 90° pada Y agar bidang cushion
   * menjadi tegak terhadap sumbu X ear-cup.
   */
  earCushion.rotation.y =
    Math.PI / 2;

  earCushion.position.x =
    front * .175;

  earCushion.scale.set(
    1,
    1.08,
    1.10
  );

  cup.add(earCushion);

  /* =======================================================
     INNER EAR CAVITY
  ======================================================= */

  const inner =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .255,
        .255,
        .035,
        80
      ),
      innerMaterial
    );

  inner.rotation.z =
    side < 0 ? Math.PI / 2 : -Math.PI / 2;

  inner.position.x =
    front * .245;

  cup.add(inner);

  /* =======================================================
     DRIVER
  ======================================================= */

  const driver =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .12,
        .12,
        .025,
        64
      ),
      accentMaterial
    );

  driver.rotation.z =
    side < 0 ? Math.PI / 2 : -Math.PI / 2;

  driver.position.x =
    front * .255;

  cup.add(driver);

  /* =======================================================
     YOKE
  ======================================================= */

  const yoke =
    new THREE.Mesh(
      new THREE.TorusGeometry(
        .30,
        .035,
        16,
        48,
        Math.PI
      ),
      metalMaterial
    );

  /*
   * Yoke mengikuti bidang samping ear-cup.
   * Jangan menghadap kamera.
   */
  yoke.rotation.y =
    Math.PI / 2;

  yoke.rotation.x =
    side < 0 ? 0 : Math.PI;

  yoke.position.set(
    -side * .04,
    .05,
    0
  );

  yoke.scale.set(
    .72,
    1.15,
    1
  );

  cup.add(yoke);

  /* =======================================================
     HINGE
  ======================================================= */

  const hinge =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .085,
        .085,
        .18,
        40
      ),
      metalMaterial
    );

  hinge.rotation.z =
    side < 0 ? Math.PI / 2 : -Math.PI / 2;

  hinge.position.set(
    -side * .08,
    .12,
    0
  );

  cup.add(hinge);

  product.add(cup);
}

createCup(-1);
createCup(1);

/* =========================================================
   DRAG
========================================================= */

let dragging =
  false;

let lastX =
  0;

let lastY =
  0;

let velocityY =
  0;

let velocityX =
  0;

renderer.domElement.addEventListener(
  "pointerdown",
  function(e){

    dragging =
      true;

    lastX =
      e.clientX;

    lastY =
      e.clientY;

    velocityY =
      0;

    velocityX =
      0;

    renderer.domElement.setPointerCapture(
      e.pointerId
    );

  }
);

renderer.domElement.addEventListener(
  "pointermove",
  function(e){

    if(!dragging){
      return;
    }

    const dx =
      e.clientX -
      lastX;

    const dy =
      e.clientY -
      lastY;

    lastX =
      e.clientX;

    lastY =
      e.clientY;

    velocityY =
      dx * .008;

    velocityX =
      dy * .004;

    product.rotation.y +=
      velocityY;

    product.rotation.x +=
      velocityX;

    product.rotation.x =
      THREE.MathUtils.clamp(
        product.rotation.x,
        -.48,
        .48
      );

  }
);

function release(e){

  dragging =
    false;

  try{

    renderer.domElement
      .releasePointerCapture(
        e.pointerId
      );

  }catch(_){}

}

renderer.domElement.addEventListener(
  "pointerup",
  release
);

renderer.domElement.addEventListener(
  "pointercancel",
  release
);

/* =========================================================
   RESIZE
========================================================= */

function resize(){

  const width =
    Math.max(
      viewer.clientWidth,
      1
    );

  const height =
    Math.max(
      viewer.clientHeight,
      1
    );

  camera.aspect =
    width / height;

  camera.updateProjectionMatrix();

  renderer.setSize(
    width,
    height,
    false
  );

}

window.addEventListener(
  "resize",
  resize
);

resize();

/* =========================================================
   ANIMATION
========================================================= */

const clock =
  new THREE.Clock();

function animate(){

  requestAnimationFrame(
    animate
  );

  if(!dragging){

    product.rotation.y +=
      velocityY;

    product.rotation.x +=
      velocityX;

    velocityY *=
      .94;

    velocityX *=
      .92;

    product.position.y =
      -.12 +
      Math.sin(
        clock.getElapsedTime() * .8
      ) * .012;

  }

  renderer.render(
    scene,
    camera
  );

}

animate();

})();
</script>

</body>
</html>
