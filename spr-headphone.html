<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
}

#msg{
  position:fixed;
  z-index:10;
  top:20px;
  left:20px;
  right:20px;
  padding:15px;
  font:16px monospace;
  background:#eee;
}

#viewer{
  position:fixed;
  inset:0;
}
</style>
</head>

<body>

<div id="msg">START...</div>
<div id="viewer"></div>

<script>
const msg = document.getElementById("msg");

msg.textContent = "1. SCRIPT BERJALAN";
msg.style.background = "#b6ffb6";

window.onerror = function(message, source, line, column, error){
  msg.textContent =
    "ERROR: " + message +
    " | line " + line;
  msg.style.background = "#ffb6b6";
};

msg.textContent = "2. LOADING THREE...";
</script>

<script src="./three.min.js"></script>

<script>
try {

  if(typeof THREE === "undefined"){
    throw new Error("THREE UNDEFINED");
  }

  msg.textContent = "3. THREE OK";

  const scene = new THREE.Scene();

  scene.background = new THREE.Color(0xeeeeee);

  const camera =
    new THREE.PerspectiveCamera(
      45,
      window.innerWidth/window.innerHeight,
      .1,
      100
    );

  camera.position.z = 4;

  msg.textContent = "4. CAMERA OK";

  const renderer =
    new THREE.WebGLRenderer({
      antialias:true,
      alpha:false
    });

  msg.textContent = "5. RENDERER OK";

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  document
    .getElementById("viewer")
    .appendChild(renderer.domElement);

  const light =
    new THREE.DirectionalLight(
      0xffffff,
      5
    );

  light.position.set(3,4,5);

  scene.add(light);

  scene.add(
    new THREE.AmbientLight(
      0xffffff,
      2
    )
  );

  const cube =
    new THREE.Mesh(
      new THREE.BoxGeometry(1.5,1.5,1.5),
      new THREE.MeshStandardMaterial({
        color:0x111111
      })
    );

  scene.add(cube);

  msg.textContent = "6. RENDER LOOP OK";

  function animate(){

    requestAnimationFrame(animate);

    cube.rotation.x += .01;
    cube.rotation.y += .015;

    renderer.render(
      scene,
      camera
    );
  }

  animate();

} catch(error) {

  msg.textContent =
    "THREE ERROR: " + error.message;

  msg.style.background = "#ff7777";
}
</script>

</body>
</html>
