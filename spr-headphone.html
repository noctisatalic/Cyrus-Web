<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}

#viewer{
  position:fixed;
  inset:0;
  overflow:hidden;
  cursor:grab;
  touch-action:none;
}

#viewer:active{
  cursor:grabbing;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}
</style>
</head>

<body>

<div id="viewer"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.min.js"></script>

<script>
(() => {
"use strict";

const viewer = document.getElementById("viewer");

if (!window.THREE) {
  viewer.innerHTML =
    '<div style="color:white;font:16px Arial;padding:20px">Three.js gagal dimuat</div>';
  return;
}

/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  32,
  1,
  0.1,
  100
);

camera.position.set(0,0,6.8);

/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1,2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

viewer.appendChild(renderer.domElement);

/* =========================================================
   LIGHTING
========================================================= */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x111111,
    2.2
  )
);

const key = new THREE.DirectionalLight(
  0xffffff,
  4.5
);

key.position.set(4,5,6);
scene.add(key);

const fill = new THREE.DirectionalLight(
  0xffffff,
  2.2
);

fill.position.set(-4,2,4);
scene.add(fill);

const rim = new THREE.DirectionalLight(
  0xffffff,
  3
);

rim.position.set(-4,4,-5);
scene.add(rim);

/* =========================================================
   MATERIALS
========================================================= */

const shellMaterial =
new THREE.MeshPhysicalMaterial({
  color:0x151719,
  roughness:.22,
  metalness:.55,
  clearcoat:.9,
  clearcoatRoughness:.12
});

const rubberMaterial =
new THREE.MeshPhysicalMaterial({
  color:0x030303,
  roughness:.82,
  metalness:.02
});

const innerMaterial =
new THREE.MeshPhysicalMaterial({
  color:0x010101,
  roughness:.95,
  metalness:0
});

const metalMaterial =
new THREE.MeshPhysicalMaterial({
  color:0x777777,
  roughness:.22,
  metalness:1,
  clearcoat:.45
});

/* =========================================================
   PRODUCT
========================================================= */

const product = new THREE.Group();

scene.add(product);

product.scale.set(.82,.82,.82);

product.rotation.y = -.28;

/* =========================================================
   HEADBAND
   Realistic continuous arch
========================================================= */

const bandCurve =
new THREE.CatmullRomCurve3([

  new THREE.Vector3(-1.25,-.18,0),

  new THREE.Vector3(-1.24,.55,0),

  new THREE.Vector3(-1.02,1.05,0),

  new THREE.Vector3(-.68,1.40,0),

  new THREE.Vector3(-.32,1.58,0),

  new THREE.Vector3(0,1.63,0),

  new THREE.Vector3(.32,1.58,0),

  new THREE.Vector3(.68,1.40,0),

  new THREE.Vector3(1.02,1.05,0),

  new THREE.Vector3(1.24,.55,0),

  new THREE.Vector3(1.25,-.18,0)

]);

const band =
new THREE.Mesh(
  new THREE.TubeGeometry(
    bandCurve,
    96,
    .135,
    24,
    false
  ),
  shellMaterial
);

product.add(band);

/* =========================================================
   INNER HEAD CUSHION
========================================================= */

const cushionCurve =
new THREE.CatmullRomCurve3([

  new THREE.Vector3(-.94,-.08,-.02),

  new THREE.Vector3(-.93,.48,-.02),

  new THREE.Vector3(-.76,.88,-.02),

  new THREE.Vector3(-.50,1.16,-.02),

  new THREE.Vector3(-.20,1.29,-.02),

  new THREE.Vector3(0,1.32,-.02),

  new THREE.Vector3(.20,1.29,-.02),

  new THREE.Vector3(.50,1.16,-.02),

  new THREE.Vector3(.76,.88,-.02),

  new THREE.Vector3(.93,.48,-.02),

  new THREE.Vector3(.94,-.08,-.02)

]);

const headCushion =
new THREE.Mesh(
  new THREE.TubeGeometry(
    cushionCurve,
    80,
    .075,
    18,
    false
  ),
  rubberMaterial
);

product.add(headCushion);

/* =========================================================
   EAR CUP
========================================================= */

function createCup(side){

  const cup = new THREE.Group();

  cup.position.set(
    side * 1.25,
    -.18,
    0
  );

  /*
   * Housing axis Z.
   * Front surface faces camera.
   */

  const housing =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .60,
      .60,
      .36,
      72,
      1,
      false
    ),
    shellMaterial
  );

  housing.rotation.x = Math.PI/2;

  cup.add(housing);

  /*
   * Outer metallic ring.
   */

  const outerRing =
  new THREE.Mesh(
    new THREE.TorusGeometry(
      .49,
      .055,
      20,
      72
    ),
    metalMaterial
  );

  outerRing.position.z = .19;

  cup.add(outerRing);

  /*
   * Thick ear cushion.
   * Sengaja ditarik KE DALAM housing.
   */

  const earCushion =
  new THREE.Mesh(
    new THREE.TorusGeometry(
      .39,
      .125,
      32,
      72
    ),
    rubberMaterial
  );

  earCushion.position.z = .125;

  cup.add(earCushion);

  /*
   * Inner speaker.
   * Tidak keluar melewati cushion.
   */

  const speaker =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .285,
      .285,
      .035,
      64
    ),
    innerMaterial
  );

  speaker.rotation.x = Math.PI/2;

  speaker.position.z = .11;

  cup.add(speaker);

  /*
   * Speaker grille.
   */

  const grille =
  new THREE.Mesh(
    new THREE.TorusGeometry(
      .23,
      .018,
      12,
      48
    ),
    metalMaterial
  );

  grille.position.z = .135;

  cup.add(grille);

  /*
   * Connector dari headband ke cup.
   * Pendek dan berada di area sambungan,
   * bukan batang di tengah headphone.
   */

  const connector =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .11,
      .11,
      .30,
      32
    ),
    metalMaterial
  );

  connector.rotation.z = Math.PI/2;

  connector.position.set(
    -side * .10,
    .20,
    0
  );

  cup.add(connector);

  product.add(cup);
}

createCup(-1);
createCup(1);

/* =========================================================
   DRAG ROTATION
========================================================= */

let dragging = false;

let lastX = 0;
let lastY = 0;

let velocityY = 0;
let velocityX = 0;

renderer.domElement.addEventListener(
  "pointerdown",
  e => {

    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;

    velocityX = 0;
    velocityY = 0;

    renderer.domElement.setPointerCapture(
      e.pointerId
    );
  }
);

renderer.domElement.addEventListener(
  "pointermove",
  e => {

    if(!dragging) return;

    const dx = e.clientX-lastX;
    const dy = e.clientY-lastY;

    lastX = e.clientX;
    lastY = e.clientY;

    velocityY = dx*.008;
    velocityX = dy*.004;

    product.rotation.y += velocityY;
    product.rotation.x += velocityX;

    product.rotation.x =
      THREE.MathUtils.clamp(
        product.rotation.x,
        -.55,
        .55
      );
  }
);

function release(e){

  dragging = false;

  try{
    renderer.domElement.releasePointerCapture(
      e.pointerId
    );
  }catch(_){}
}

renderer.domElement.addEventListener(
  "pointerup",
  release
);

renderer.domElement.addEventListener(
  "pointercancel",
  release
);

/* =========================================================
   RESIZE
========================================================= */

function resize(){

  const width =
    Math.max(viewer.clientWidth,1);

  const height =
    Math.max(viewer.clientHeight,1);

  camera.aspect =
    width/height;

  camera.updateProjectionMatrix();

  renderer.setSize(
    width,
    height,
    false
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();

/* =========================================================
   ANIMATION
========================================================= */

const clock = new THREE.Clock();

function animate(){

  requestAnimationFrame(animate);

  if(!dragging){

    product.rotation.y += velocityY;
    product.rotation.x += velocityX;

    velocityY *= .94;
    velocityX *= .92;

    product.position.y =
      Math.sin(
        clock.getElapsedTime()*.8
      )*.012;
  }

  renderer.render(
    scene,
    camera
  );
}

animate();

})();
</script>

</body>
</html>
