<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#111;
}
.box{
  width:220px;
  height:220px;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) rotate(15deg);
  border-radius:40px;
  background:linear-gradient(135deg,#fff,#555);
  box-shadow:0 30px 60px #000;
}
.text{
  position:absolute;
  top:20px;
  width:100%;
  text-align:center;
  color:white;
  font:20px Arial;
}
</style>
</head>
<body>
<div class="text">HTML/CSS TEST OK</div>
<div class="box"></div>
</body>
</html>
