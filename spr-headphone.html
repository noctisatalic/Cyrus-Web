<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}

#viewer{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  cursor:grab;
  touch-action:none;
}

#viewer:active{
  cursor:grabbing;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}
</style>
</head>

<body>

<div id="viewer"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.min.js"></script>

<script>
(function(){

"use strict";

const viewer =
document.getElementById("viewer");

const scene =
new THREE.Scene();

const camera =
new THREE.PerspectiveCamera(
  32,
  1,
  .1,
  100
);

camera.position.set(
  0,
  .05,
  6.8
);

const renderer =
new THREE.WebGLRenderer({
  antialias:true,
  alpha:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    2
  )
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
1.15;

viewer.appendChild(
  renderer.domElement
);


/* =========================
   LIGHT
========================= */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x111111,
    2.2
  )
);

const key =
new THREE.DirectionalLight(
  0xffffff,
  4.5
);

key.position.set(
  4,
  5,
  6
);

scene.add(key);

const fill =
new THREE.DirectionalLight(
  0xffffff,
  2.5
);

fill.position.set(
  -4,
  2,
  4
);

scene.add(fill);

const rim =
new THREE.DirectionalLight(
  0xffffff,
  3
);

rim.position.set(
  -4,
  4,
  -5
);

scene.add(rim);


/* =========================
   MATERIAL
========================= */

const shell =
new THREE.MeshPhysicalMaterial({
  color:0x151719,
  roughness:.23,
  metalness:.62,
  clearcoat:.8,
  clearcoatRoughness:.16
});

const rubber =
new THREE.MeshPhysicalMaterial({
  color:0x020202,
  roughness:.88,
  metalness:.02
});

const inner =
new THREE.MeshPhysicalMaterial({
  color:0x000000,
  roughness:.96,
  metalness:.01
});

const metal =
new THREE.MeshPhysicalMaterial({
  color:0x727477,
  roughness:.22,
  metalness:1,
  clearcoat:.4
});


/* =========================
   PRODUCT
========================= */

const product =
new THREE.Group();

scene.add(product);

product.scale.set(
  .82,
  .82,
  .82
);

product.rotation.y =
-.28;


/* =========================
   HEADBAND
========================= */

const bandCurve =
new THREE.CatmullRomCurve3([

  new THREE.Vector3(-1.25,-.25,0),

  new THREE.Vector3(-1.25,.65,0),

  new THREE.Vector3(-.95,1.35,0),

  new THREE.Vector3(-.45,1.68,0),

  new THREE.Vector3(0,1.77,0),

  new THREE.Vector3(.45,1.68,0),

  new THREE.Vector3(.95,1.35,0),

  new THREE.Vector3(1.25,.65,0),

  new THREE.Vector3(1.25,-.25,0)

]);

const band =
new THREE.Mesh(
  new THREE.TubeGeometry(
    bandCurve,
    100,
    .14,
    24,
    false
  ),
  shell
);

product.add(band);


/* =========================
   INNER HEAD CUSHION
========================= */

const cushionCurve =
new THREE.CatmullRomCurve3([

  new THREE.Vector3(-.92,-.05,-.01),

  new THREE.Vector3(-.92,.62,-.01),

  new THREE.Vector3(-.68,1.08,-.01),

  new THREE.Vector3(-.32,1.34,-.01),

  new THREE.Vector3(0,1.41,-.01),

  new THREE.Vector3(.32,1.34,-.01),

  new THREE.Vector3(.68,1.08,-.01),

  new THREE.Vector3(.92,.62,-.01),

  new THREE.Vector3(.92,-.05,-.01)

]);

const headCushion =
new THREE.Mesh(
  new THREE.TubeGeometry(
    cushionCurve,
    90,
    .09,
    20,
    false
  ),
  rubber
);

product.add(headCushion);


/* =========================
   EAR CUP
========================= */

function createCup(side){

  const cup =
  new THREE.Group();

  cup.position.x =
    side * 1.27;

  /*
   * Housing axis = Z.
   * Front surface mengarah ke
   * tengah / dalam headphone.
   */

  const housing =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .64,
      .64,
      .38,
      72,
      1
    ),
    shell
  );

  housing.rotation.x =
    Math.PI / 2;

  cup.add(housing);


  /*
   * Outer ring
   */

  const outerRing =
  new THREE.Mesh(
    new THREE.TorusGeometry(
      .50,
      .075,
      24,
      80
    ),
    metal
  );

  outerRing.position.z =
    side < 0 ? .18 : .18;

  cup.add(outerRing);


  /*
   * Deep ear cushion.
   * Sengaja masuk ke housing.
   */

  const earCushion =
  new THREE.Mesh(
    new THREE.TorusGeometry(
      .405,
      .145,
      32,
      80
    ),
    rubber
  );

  earCushion.position.z =
    .12;

  cup.add(earCushion);


  /*
   * Lubang telinga.
   * Tidak menonjol keluar.
   */

  const opening =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .285,
      .285,
      .035,
      64
    ),
    inner
  );

  opening.rotation.x =
    Math.PI / 2;

  opening.position.z =
    .10;

  cup.add(opening);


  /*
   * Rear shell sedikit menonjol
   * ke belakang untuk memberi
   * volume body.
   */

  const rear =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .57,
      64,
      40
    ),
    shell
  );

  rear.scale.z =
    .42;

  rear.position.z =
    -.12;

  cup.add(rear);


  /*
   * Connector pendek.
   * Tidak ada batang besi
   * di tengah headphone.
   */

  const connector =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .10,
      .10,
      .25,
      32
    ),
    metal
  );

  connector.rotation.z =
    Math.PI / 2;

  connector.position.x =
    -side * .10;

  cup.add(connector);


  product.add(cup);

}

createCup(-1);
createCup(1);


/* =========================
   ROTATION
========================= */

let dragging =
false;

let previousX =
0;

let previousY =
0;

let velocityY =
0;

let velocityX =
0;

renderer.domElement.addEventListener(
  "pointerdown",
  function(e){

    dragging = true;

    previousX =
      e.clientX;

    previousY =
      e.clientY;

    velocityY = 0;
    velocityX = 0;

    renderer.domElement.setPointerCapture(
      e.pointerId
    );

  }
);

renderer.domElement.addEventListener(
  "pointermove",
  function(e){

    if(!dragging)
      return;

    const dx =
      e.clientX -
      previousX;

    const dy =
      e.clientY -
      previousY;

    previousX =
      e.clientX;

    previousY =
      e.clientY;

    velocityY =
      dx * .008;

    velocityX =
      dy * .0035;

    product.rotation.y +=
      velocityY;

    product.rotation.x +=
      velocityX;

    product.rotation.x =
      THREE.MathUtils.clamp(
        product.rotation.x,
        -.48,
        .48
      );

  }
);

function release(e){

  dragging = false;

  try{

    renderer.domElement
      .releasePointerCapture(
        e.pointerId
      );

  }catch(_){}

}

renderer.domElement.addEventListener(
  "pointerup",
  release
);

renderer.domElement.addEventListener(
  "pointercancel",
  release
);


/* =========================
   RESIZE
========================= */

function resize(){

  const w =
    Math.max(
      viewer.clientWidth,
      1
    );

  const h =
    Math.max(
      viewer.clientHeight,
      1
    );

  camera.aspect =
    w / h;

  camera.updateProjectionMatrix();

  renderer.setSize(
    w,
    h,
    false
  );

}

new ResizeObserver(
  resize
).observe(viewer);

resize();


/* =========================
   LOOP
========================= */

const clock =
new THREE.Clock();

function animate(){

  requestAnimationFrame(
    animate
  );

  if(!dragging){

    product.rotation.y +=
      velocityY;

    product.rotation.x +=
      velocityX;

    velocityY *= .94;
    velocityX *= .92;

    product.position.y =
      Math.sin(
        clock.getElapsedTime() *
        .8
      ) * .012;

  }

  renderer.render(
    scene,
    camera
  );

}

animate();

})();
</script>

</body>
</html>
