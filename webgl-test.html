<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:white;
  overflow:hidden;
}
#result{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font:700 22px Arial;
}
canvas{
  display:block;
}
</style>
</head>

<body>

<div id="result">TESTING WEBGL...</div>

<script>
const result=document.getElementById("result");

try{

  const canvas=document.createElement("canvas");

  const gl=
    canvas.getContext("webgl") ||
    canvas.getContext("experimental-webgl");

  if(!gl){
    throw new Error("WEBGL CONTEXT TIDAK TERSEDIA");
  }

  result.textContent=
    "WEBGL AKTIF ✓";

  result.style.color="green";

}catch(error){

  result.textContent=
    "WEBGL ERROR: "+error.message;

  result.style.color="red";

  console.error(error);
}
</script>

</body>
</html>
